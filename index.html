function calcPricing() {
var units = [];
cart.forEach(function (it) {
var p = toNum(it.price);
for (var i = 0; i < it.qty; i++) units.push(p);
});
units.sort(function (a, b) { return b - a; });
var n = units.length, sub = 0, discount = 0, i = 0;
units.forEach(function (u) { sub += u; });

i += 4;

else if (rest === 2) discount += Math.max(0, units[i] + units[i + 1] - BUNDLE2);

var promo = promoApplied ? Math.min(promoApplied.discount, base) : 0;

      f.querySelector('[data-s]').onclick = function () {
        var reason = f.querySelector('[data-r]').value.trim(); if (reason.length < 3) { showToast('اكتب السبب'); return; }
        var file = f.querySelector('[data-i]').files[0], send = function (b64) { postApi({ type: 'track_return', sess: SESS, inv: inv, kind: f.querySelector('[data-k]').value, reason: reason, img: b64 || '' }, function (r) { showToast(r && r.ok ? 'وصل طلبك، هنكلمك' : (ERR[r && r.error] || 'حصل خطأ')); if (r && r.ok) f.innerHTML = '<div class="hzn">وصل طلبك وهنتواصل معاك.</div>'; }, 60000); };
        if (!file) { send(''); return; }
        var im = new Image(), u = URL.createObjectURL(file); im.onload = function () { var s = Math.min(1, 1200 / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = im.width * s; cv.height = im.height * s; cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); send(cv.toDataURL('image/jpeg', .8).split(',')[1]); }; im.onerror = function () { send(''); }; im.src = u;
      };
      return;
    }
    if (a === 'addr') {
      var G = window.__hzGeo || {}, gs = Object.keys(G);
      f.innerHTML = '<select data-g>' + gs.map(function (g) { return '<option>' + g + '</option>'; }).join('') + '</select><select data-c></select><textarea data-a placeholder="العنوان بالتفصيل"></textarea><button class="btn add" type="button" data-s>حفظ العنوان</button>';
      var sg = f.querySelector('[data-g]'), sc = f.querySelector('[data-c]'); function fc() { sc.innerHTML = (G[sg.value] || []).filter(function (x) { return x.ok; }).map(function (x) { return '<option>' + x.c + '</option>'; }).join(''); } sg.onchange = fc; fc();
      f.querySelector('[data-s]').onclick = function () { postApi({ type: 'track_address', sess: SESS, inv: inv, gov: sg.value, city: sc.value, address: f.querySelector('[data-a]').value }, function (r) { showToast(r && r.ok ? 'تم تعديل العنوان' : (ERR[r && r.error] || 'حصل خطأ')); if (r && r.ok) list(); }, 30000); };
    }
  }
  function direct(tok) {
    var p = String(tok).split('.'); box.innerHTML = head('حالة طلبك') + '<div class="hzn">جاري التحميل...</div>'; bindX(); ov.classList.add('open');
    postApi({ type: 'track_link', inv: p[0], tk: p[1] }, function (r) {
      if (!r || !r.ok || !r.orders.length) { box.innerHTML = head('حالة طلبك') + '<div class="hzb">' + (r ? 'اللينك مش صحيح' : 'مشكلة في النت') + '</div>'; bindX(); return; }
      box.innerHTML = head('حالة طلبك') + card(r.orders[0], true) + '<button class="btn add" type="button" id="hzall">شوف كل طلباتك</button>'; bindX();
      $$('hzall').onclick = function () { if (SESS) list(); else login('in'); };
    }, 30000);
  }
  window.__hzTrack = function (tok) { if (tok) direct(tok); else { ov.classList.add('open'); if (SESS) list(); else login('in'); } };
  var ft = $$('foot'), b = el('button', 'hzlink', 'تتبع طلبي'); b.type = 'button'; b.style.cssText = 'display:block;margin:8px auto 0'; b.onclick = function () { window.__hzTrack(); }; ft.appendChild(b);
  var m = /#track=([^&]*)/.exec(location.hash || '');
  if (m) { var t = decodeURIComponent(m[1]); try { history.replaceState(history.state, '', location.pathname + location.search); } catch (e) {} setTimeout(function () { window.__hzTrack(t.indexOf('.') > 0 ? t : ''); }, 300); }
})();

(function start() {
var c = readCache();
if (c && c.products && c.products.length) applyData(c, true);
else showSkeleton();
fetchData();
})();
</script>
